name: Expensive geometry

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  exact-clearance:
    name: Exact BREP clearance sweeps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install OpenGL runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1
      - name: Create OpenCASCADE environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: none
          cache-environment: true
          cache-environment-key: occ-${{ runner.os }}-${{ hashFiles('environment.yml', 'pyproject.toml') }}
          post-cleanup: all
      - name: Install YapRover
        shell: micromamba-shell {0}
        run: python -m pip install -e '.[test]'
      - name: Run exact geometry suite
        shell: micromamba-shell {0}
        env:
          VISUALTEST: "false"
        run: pytest -m "expensive_geometry and not visual"
